name: Validate MCP and OCI shadow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_ghcr:
        description: Create or repair the commit-scoped GHCR bootstrap
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Gate authoritative live catalog
        run: npm run catalog:gate
      - name: Test server and generated artifacts
        run: npm test
      - name: Validate official Registry schema
        run: npm run validate:registry
      - name: Validate MCPB manifest
        run: npm run validate
      - name: Pack deterministic MCPB and npx artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          npm run pack:mcpb
          first="$(sha256sum dist/lumi-app-finder.mcpb | cut -d' ' -f1)"
          expected="$(node -p \
            "require('./server.release.json').packages.find((entry) => entry.registryType === 'mcpb').fileSha256")"
          test "$first" = "$expected"
          npm run pack:mcpb
          second="$(sha256sum dist/lumi-app-finder.mcpb | cut -d' ' -f1)"
          test "$first" = "$second"
          version="$(node -p "require('./package.json').version")"
          npm pack --pack-destination dist >/dev/null
          mv "dist/lumi-app-finder-mcp-${version}.tgz" \
            dist/lumi-app-finder-npx.tgz
          first_npx="$(sha256sum dist/lumi-app-finder-npx.tgz | cut -d' ' -f1)"
          rm dist/lumi-app-finder-npx.tgz
          npm pack --pack-destination dist >/dev/null
          mv "dist/lumi-app-finder-mcp-${version}.tgz" \
            dist/lumi-app-finder-npx.tgz
          second_npx="$(sha256sum dist/lumi-app-finder-npx.tgz | cut -d' ' -f1)"
          test "$first_npx" = "$second_npx"
          (
            cd dist
            sha256sum lumi-app-finder.mcpb lumi-app-finder-npx.tgz \
              > SHA256SUMS
          )
          npx mcpb info dist/lumi-app-finder.mcpb
      - name: Smoke local stdio package
        run: npm run smoke
      - name: Benchmark and size report
        run: node scripts/benchmark.mjs --output dist/benchmark.json
      - name: Upload quality reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumi-mcp-quality
          path: |
            dist/SHA256SUMS
            dist/benchmark.json
          if-no-files-found: error
          retention-days: 7

  oci-shadow:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Resolve reproducible image metadata
        id: metadata
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "version=$(node -p "require('./package.json').version")" \
            >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" \
            >> "$GITHUB_OUTPUT"
      - name: Build multi-architecture OCI shadow
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=dist/lumi-app-finder.oci.tar
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.metadata.outputs.created }}
      - name: Verify multi-architecture OCI index
        run: |
          set -euo pipefail
          mkdir -p dist/oci-layout
          tar -xf dist/lumi-app-finder.oci.tar -C dist/oci-layout
          node scripts/verify-oci-layout.mjs \
            dist/oci-layout dist/oci-index.json
          node scripts/verify-image-index.mjs dist/oci-index.json
      - name: Attest shadow OCI artifact
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/lumi-app-finder.oci.tar
      - name: Build native image for digest canary
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: lumi-app-finder:shadow
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.metadata.outputs.created }}
      - name: Verify metadata, size, and MCP by image digest
        run: |
          set -euo pipefail
          docker image inspect lumi-app-finder:shadow \
            > dist/image-inspect.json
          node scripts/verify-image-metadata.mjs dist/image-inspect.json
          image_id="$(docker image inspect --format '{{.Id}}' \
            lumi-app-finder:shadow)"
          printf '%s\n' "$image_id" > dist/image-digest.txt
          node scripts/mcp-smoke.mjs -- \
            docker run --rm -i \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --pids-limit 64 \
              --memory 256m \
              "$image_id"
      - name: Generate native image SBOM
        run: |
          bash scripts/install-syft.sh
          "${RUNNER_TEMP}/lumi-syft-bin/syft" docker:lumi-app-finder:shadow \
            -o spdx-json=dist/lumi-app-finder.spdx.json
      - name: Validate SBOM
        run: |
          node -e '
            const fs = require("node:fs");
            const sbom = JSON.parse(
              fs.readFileSync("dist/lumi-app-finder.spdx.json", "utf8"),
            );
            if (sbom.spdxVersion !== "SPDX-2.3") process.exit(1);
            if (!Array.isArray(sbom.packages) || !sbom.packages.length) {
              process.exit(1);
            }
          '
      - name: Upload OCI shadow reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumi-mcp-oci-shadow
          path: |
            dist/image-digest.txt
            dist/image-inspect.json
            dist/lumi-app-finder.spdx.json
            dist/oci-index.json
          if-no-files-found: error
          retention-days: 7

  ghcr-bootstrap:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_ghcr }}
    needs: [quality, oci-shadow]
    runs-on: ubuntu-latest
    concurrency:
      group: lumi-mcp-ghcr-bootstrap
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE_NAME: ghcr.io/alice51849/lumi-app-finder
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Refuse bootstrap after the package is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          status="$(curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --proto '=https' \
            --tlsv1.2 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output dist/ghcr-package-preflight.json \
            --write-out '%{http_code}' \
            "${GITHUB_API_URL}/user/packages/container/lumi-app-finder")"
          case "$status" in
            200)
              test "$(node -p \
                "require('./dist/ghcr-package-preflight.json').visibility")" \
                = "private"
              ;;
            404)
              ;;
            *)
              echo "GHCR package preflight returned HTTP ${status}." >&2
              exit 1
              ;;
          esac
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Log in to GHCR for bootstrap
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve bootstrap metadata
        id: metadata
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "version=$(node -p "require('./package.json').version")" \
            >> "$GITHUB_OUTPUT"
          echo "candidate=bootstrap-${GITHUB_SHA::12}" \
            >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" \
            >> "$GITHUB_OUTPUT"
      - name: Build and push bootstrap digest
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.metadata.outputs.created }}
      - name: Generate bootstrap digest-bound SBOM
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          bash scripts/install-syft.sh
          "${RUNNER_TEMP}/lumi-syft-bin/syft" \
            "registry:${IMAGE_NAME}@${DIGEST}" \
            -o spdx-json=dist/lumi-app-finder.spdx.json
      - name: Validate bootstrap SBOM
        run: |
          node -e '
            const fs = require("node:fs");
            const sbom = JSON.parse(
              fs.readFileSync("dist/lumi-app-finder.spdx.json", "utf8"),
            );
            if (sbom.spdxVersion !== "SPDX-2.3") process.exit(1);
            if (!Array.isArray(sbom.packages) || !sbom.packages.length) {
              process.exit(1);
            }
          '
      - name: Attest bootstrap provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest bootstrap SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: dist/lumi-app-finder.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify bootstrap digest architectures, labels, and size
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}@${DIGEST}"
          docker image inspect "${IMAGE_NAME}@${DIGEST}" \
            > dist/image-inspect.json
          docker buildx imagetools inspect --raw \
            "${IMAGE_NAME}@${DIGEST}" > dist/oci-index.json
          node scripts/verify-image-index.mjs dist/oci-index.json
          node scripts/verify-image-metadata.mjs dist/image-inspect.json
          printf '%s\n' "$DIGEST" > dist/image-digest.txt
      - name: Smoke immutable bootstrap digest across 50 locales
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node scripts/mcp-smoke.mjs -- \
            docker run --rm -i \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --pids-limit 64 \
              --memory 256m \
              "${IMAGE_NAME}@${DIGEST}"
      - name: Verify signed bootstrap provenance and SBOM attestations
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject="oci://${IMAGE_NAME}@${DIGEST}"
          common=(
            --repo "$GITHUB_REPOSITORY"
            --signer-repo "$GITHUB_REPOSITORY"
            --source-digest "$GITHUB_SHA"
            --deny-self-hosted-runners
          )
          gh attestation verify "$subject" "${common[@]}"
          gh attestation verify "$subject" "${common[@]}" \
            --predicate-type https://spdx.dev/Document/v2.3
      - name: Promote verified digest to commit tag
        env:
          CANDIDATE: ${{ steps.metadata.outputs.candidate }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${CANDIDATE}" \
            "${IMAGE_NAME}@${DIGEST}"
      - name: Reverify tag binding and package visibility
        env:
          CANDIDATE: ${{ steps.metadata.outputs.candidate }}
          DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}:${CANDIDATE}"
          docker buildx imagetools inspect --raw \
            "${IMAGE_NAME}:${CANDIDATE}" \
            > dist/bootstrap-tag-inspect.json
          tag_digest="$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${CANDIDATE}" \
            --format '{{ .Manifest.Digest }}')"
          test "$tag_digest" = "$DIGEST"
          visibility="$(gh api \
            '/user/packages/container/lumi-app-finder' \
            --jq '.visibility')"
          case "$visibility" in
            private)
              ;;
            public)
              anonymous_config="${RUNNER_TEMP}/lumi-bootstrap-anonymous"
              install -d -m 0700 "$anonymous_config"
              for attempt in 1 2 3 4; do
                if DOCKER_CONFIG="$anonymous_config" \
                  docker pull "${IMAGE_NAME}:${CANDIDATE}"; then
                  break
                fi
                test "$attempt" -lt 4
                sleep $((attempt * 15))
              done
              DOCKER_CONFIG="$anonymous_config" \
                docker pull "${IMAGE_NAME}@${DIGEST}"
              ;;
            *)
              echo "Unexpected GHCR visibility: ${visibility}" >&2
              exit 1
              ;;
          esac
          printf 'visibility=%s\n' "$visibility" \
            > dist/bootstrap-visibility.txt
      - name: Upload bootstrap reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumi-mcp-ghcr-bootstrap-${{ github.run_id }}
          path: |
            dist/image-digest.txt
            dist/image-inspect.json
            dist/bootstrap-tag-inspect.json
            dist/bootstrap-visibility.txt
            dist/lumi-app-finder.spdx.json
            dist/oci-index.json
          if-no-files-found: error
          retention-days: 7
